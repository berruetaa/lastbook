name: Native i18n desktop evidence

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to validate'
        type: choice
        options: [both, windows, macos]
        default: both
      build_windows_llm:
        description: 'Download and build the pinned Windows LLM toolchain (up to 20 minutes)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} / native desktop and official build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows' && '[{"os":"windows-2025","python":"3.14.10","requirements":"packaging/requirements_app.txt"}]' || inputs.platform == 'macos' && '[{"os":"macos-15","python":"3.11.18","requirements":"packaging/requirements_macos.txt"}]' || '[{"os":"windows-2025","python":"3.14.10","requirements":"packaging/requirements_app.txt"},{"os":"macos-15","python":"3.11.18","requirements":"packaging/requirements_macos.txt"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Create evidence folder
        run: mkdir -p evidence
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        if: runner.os == 'macOS'
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Prepare pinned macOS Python with uv
        if: runner.os == 'macOS'
        run: |
          uv venv --seed --python '${{ matrix.python }}' "$RUNNER_TEMP/lastbook-native-venv"
          echo "$RUNNER_TEMP/lastbook-native-venv/bin" >> "$GITHUB_PATH"
      - name: Describe host and user session
        run: |
          mkdir -p evidence
          python --version | tee evidence/python.txt
          python -c "import platform;print(platform.platform());print(platform.machine())" | tee evidence/platform.txt
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sw_vers | tee evidence/system.txt
            who | tee evidence/session.txt
            system_profiler SPDisplaysDataType | head -80 | tee evidence/display.txt
          else
            powershell.exe -NoProfile -Command 'Get-Process -Id $PID | Select-Object Id,SessionId; quser; Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\*" -ErrorAction SilentlyContinue | Where-Object { $_.name -match "WebView2" } | Select-Object name,pv' 2>&1 | tee evidence/session.txt || true
          fi
      - name: Install pinned product dependencies
        run: |
          python -m pip install --only-binary=:all: -r "${{ matrix.requirements }}"
      - name: Prepare and verify WebView2 SDK
        if: runner.os == 'Windows'
        run: python -B app/tests/prepare_webview2.py | tee evidence/webview2-sdk.txt
      - name: Run native source-shell i18n smoke
        run: python -u -B app/tests/native_i18n_smoke.py evidence/native 2>&1 | tee evidence/native-smoke.log
      - name: Obtain published release manifest and validate it
        if: always()
        run: |
          mkdir -p derived/release
          curl --fail --location --retry 2 --max-time 60 https://downloads.lastbook.org/manifest-v1.json -o derived/release/manifest-v1.json
          python -B -c "import json;from engine.setup.manifest import validate;d=json.load(open('derived/release/manifest-v1.json',encoding='utf-8'));assert validate(d) and any(p.get('id')=='small' and p.get('files') for p in d['packs']);print('Published manifest passes project validation and contains Small')" | tee evidence/manifest.txt
      - name: Prepare pinned Windows LLM build tools
        if: always() && runner.os == 'Windows' && inputs.build_windows_llm
        run: python -u -B .github/scripts/prepare_windows_llm.py "$RUNNER_TEMP/lastbook-tools" 2>&1 | tee evidence/windows-tools.log
      - name: Build pinned Windows LLM runner
        if: always() && runner.os == 'Windows' && inputs.build_windows_llm
        run: |
          export TOOLS="$(cygpath -w "$RUNNER_TEMP/lastbook-tools")"
          export GIT_BASH="$(cygpath -w "$(command -v bash)")"
          python -u -c "import os,subprocess,sys; p=subprocess.run([os.environ['GIT_BASH'],'packaging/llm/build_llm_windows.sh'],timeout=1200);sys.exit(p.returncode)" 2>&1 | tee evidence/build-llm-windows.log
      - name: Attempt official Windows app build
        id: build_windows
        if: always() && runner.os == 'Windows'
        run: |
          echo 'Checking official LLM build prerequisites:' | tee evidence/build-windows.log
          ls /c/Windows/System32/vulkan-1.dll 2>&1 | tee -a evidence/build-windows.log || true
          if [[ "${{ inputs.build_windows_llm }}" != "true" ]]; then
            (bash packaging/llm/build_llm_windows.sh) 2>&1 | tee -a evidence/build-windows.log || true
          fi
          export PY="$(command -v python)"
          export WEBVIEW2="$(cygpath -w "$PWD/app/webview2")"
          export OUT="$(cygpath -w "$RUNNER_TEMP/lastbook-official-build")"
          bash packaging/build_app_windows.sh 2>&1 | tee -a evidence/build-windows.log
      - name: Build pinned macOS LLM runner
        if: always() && runner.os == 'macOS'
        run: |
          python -u -c "import subprocess,sys; f=open('evidence/build-llm.log','w'); p=subprocess.run(['bash','packaging/llm/build_llm_macos.sh'],stdout=f,stderr=subprocess.STDOUT,timeout=1200); f.close(); print(open('evidence/build-llm.log').read());sys.exit(p.returncode)"
      - name: Attempt official macOS app build
        if: always() && runner.os == 'macOS'
        run: bash packaging/build_app_macos.sh 2>&1 | tee evidence/build-macos.log
      - name: Collect build logs and scans
        if: always()
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            find derived/app-build/mac -type f \( -name 'build.log' -o -name 'scan.txt' \) -exec cp {} evidence/ \; 2>/dev/null || true
            if [[ -d derived/app-build/mac/Lastbook.app ]]; then
              ditto -c -k --sequesterRsrc --keepParent derived/app-build/mac/Lastbook.app evidence/Lastbook-macos.zip
            fi
          else
            if [[ -f "$RUNNER_TEMP/lastbook-official-build/package-scan.json" ]]; then
              cp "$RUNNER_TEMP/lastbook-official-build/package-scan.json" evidence/
            fi
            for f in derived/llm/cmake-win.log derived/llm/build-win.log derived/llm/bin-win/SHA256SUMS.txt; do
              [[ ! -f "$f" ]] || cp "$f" evidence/
            done
            if [[ "${{ steps.build_windows.outcome }}" == "success" ]]; then
              python -c "import shutil,os;shutil.make_archive('evidence/Lastbook-windows','zip',os.path.join(os.environ['RUNNER_TEMP'],'lastbook-official-build','dist'),'Lastbook')"
            fi
          fi
      - name: Save logs, reports and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-i18n-${{ matrix.os }}
          path: |
            evidence/*.txt
            evidence/*.log
            evidence/*.json
            evidence/*.zip
            evidence/native/*.log
            evidence/native/run/*.json
            evidence/native/run/*.png
            evidence/native/run/settings/ui-language.json
          if-no-files-found: warn
          retention-days: 7
